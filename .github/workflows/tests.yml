name: CLI and ModelTrace integration tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: switcher
      - uses: actions/checkout@v4
        with:
          repository: FastR-D/ModelTrace
          path: fingerprint-library
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./fingerprint-library ./switcher build
      - run: python -m unittest discover -s tests -v
        working-directory: switcher
        env:
          PYTHONUTF8: '0'
      - run: python -m build
        working-directory: switcher
      - run: python -m build fingerprint-library
      - run: python fingerprint-library/tests/verify_installation.py --wheels fingerprint-library/dist/modeltrace-0.1.0-py3-none-any.whl switcher/dist/cc_switch_simple-0.2.1-py3-none-any.whl
